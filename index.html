<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THUMB &amp; PYLON</title>
<meta name="description" content="THUMB &amp; PYLON — a single-player tower defence game. Tap to charge, build to hold. Nine towers, ten hazards, four acts.">
<meta property="og:title" content="THUMB &amp; PYLON">
<meta property="og:description" content="A single-player tower defence game. Tap to charge, build to hold.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shprink.github.io/thumb-and-pylon/">
<meta property="og:image" content="https://shprink.github.io/thumb-and-pylon/assets/play-feature-1024x500.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: #0B0A14; color: #E8E4F5;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 60rem; margin: 0 auto; padding: 48px 22px 64px; }
  header { text-align: center; }
  .logo { width: 100%; max-width: 620px; height: auto; margin: 0 auto; display: block; }
  .tagline {
    margin: 1.4em 0 .2em; font-size: 1.15rem; color: #C9C2E4; letter-spacing: .01em;
  }
  .meta {
    margin: 0; color: #9A93B5; font-size: .95rem;
    text-transform: uppercase; letter-spacing: .12em;
  }

  /* Video */
  .video {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    margin: 40px 0 8px; border-radius: 14px; overflow: hidden;
    border: 1px solid #262238; background: #06060B;
    box-shadow: 0 18px 60px -30px rgba(185,140,255,.5);
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Store buttons */
  .stores {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: center; align-items: stretch; margin: 40px 0 8px;
  }
  .store {
    display: flex; align-items: center; gap: 14px;
    min-width: 230px; padding: 14px 22px;
    border-radius: 12px; text-decoration: none;
    border: 1px solid #2C2740; background: #131024;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .store:hover { border-color: #B98CFF; transform: translateY(-2px); background: #171331; }
  .store .glyph { flex: 0 0 auto; width: 34px; height: 34px; }
  .store .lines { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .store .small { font-size: .72rem; color: #9A93B5; text-transform: uppercase; letter-spacing: .1em; }
  .store .big { font-size: 1.18rem; font-weight: 600; color: #fff; }
  .store--soon { cursor: default; opacity: .72; }
  .store--soon:hover { border-color: #2C2740; transform: none; background: #131024; }
  .store--soon .big { color: #C9C2E4; }
  .badge-soon {
    margin-left: auto; align-self: center;
    font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
    color: #0B0A14; background: #B98CFF; font-weight: 700;
    padding: 3px 8px; border-radius: 999px;
  }

  footer {
    margin-top: 56px; padding-top: 22px; border-top: 1px solid #201C33;
    text-align: center; color: #7E7799; font-size: .9rem;
  }
  footer a { color: #B98CFF; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .links { margin-bottom: .8em; }
  footer .links a { margin: 0 .5em; }

  @media (max-width: 520px) {
    .stores { flex-direction: column; align-items: stretch; }
    .store { min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="assets/thumb-pylon-1b.svg" alt="THUMB &amp; PYLON — tap to charge, build to hold" width="1243" height="703">
    <p class="meta">Nine towers · Ten hazards · Four acts</p>
  </header>

  <div class="video">
    <iframe
      src="https://www.youtube-nocookie.com/embed/IumscwK-Q_o?rel=0"
      title="THUMB &amp; PYLON gameplay"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>

  <div class="stores">
    <a class="store" href="https://play.google.com/store/apps/details?id=com.thumbpylon.game" rel="noopener">
      <svg class="glyph" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#00D9FF" d="M64 39v434c0 8 4 15 11 19l253-236L75 20c-7 4-11 11-11 19z"/>
        <path fill="#00F076" d="M75 20l253 236 68-63L110 6C98-1 85 4 75 20z"/>
        <path fill="#FF3A44" d="M328 256l68 63 74-41c19-11 19-33 0-44l-74-41-68 63z"/>
        <path fill="#FFC400" d="M75 492l253-236 68 63-286 161c-13 8-27 3-35-8z"/>
      </svg>
      <span class="lines">
        <span class="small">Get it on</span>
        <span class="big">Google Play</span>
      </span>
    </a>

    <span class="store store--soon" aria-disabled="true">
      <svg class="glyph" viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#C9C2E4" d="M318 271c-1-54 44-80 46-81-25-37-64-42-78-42-33-3-64 20-81 20-16 0-42-19-69-19-36 1-68 21-86 53-37 64-9 159 26 211 18 25 38 54 65 53 26-1 36-17 67-17 31 0 40 17 68 16 28-1 46-26 63-51 20-29 28-57 29-59-1-1-56-21-40-58zM264 82c14-17 24-40 21-64-21 1-46 14-61 31-13 15-25 39-22 62 23 2 47-12 62-29z"/>
      </svg>
      <span class="lines">
        <span class="small">Coming soon to</span>
        <span class="big">App Store</span>
      </span>
      <span class="badge-soon">Soon</span>
    </span>
  </div>

  <footer>
    <div class="links">
      <a href="privacy-policy/">Privacy Policy</a> ·
      <a href="terms/">Terms</a>
    </div>
    THUMB &amp; PYLON · com.thumbpylon.game
  </footer>

</div>
</body>
</html>
